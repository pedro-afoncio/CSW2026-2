<!DOCTYPE html>

<head>

    <title>comparações</title>

<body>
    <p><b>negrito</b> x <strong>destaque</strong></p>
    <p><i>italico</i> x <em>enfase</em></p>
    <p> <mark>texto marcado</mark></p>

    <p>texto<sup>sobrescrito</sup> x texto<sub>subscrito</sub></p>
    <p> <pre><code>codigo new</code></p>
    <p></p>

</body>
